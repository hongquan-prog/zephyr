description: Everest Semiconductor ES8311 low power mono audio codec

include: [i2c-device.yaml]

compatible: "everest,es8311"

properties:
  pa-gpios:
    type: phandle-array
    description: |
      Power amplifier enable pin, driven active while the codec is
      started and inactive while it is suspended.
